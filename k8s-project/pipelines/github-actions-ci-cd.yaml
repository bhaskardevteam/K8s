name: build-and-deploy

on:
  push:
    branches: [main]

env:
  ACR_NAME: myacr.azurecr.io
  IMAGE_NAME: k8s-demo-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -f docker/Dockerfile -t $ACR_NAME/$IMAGE_NAME:${{ github.sha }} -t $ACR_NAME/$IMAGE_NAME:latest .
          docker push $ACR_NAME/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_NAME/$IMAGE_NAME:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production   # requires manual approval if configured in repo settings
    steps:
      - uses: actions/checkout@v4

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: k8sdemo-rg
          cluster-name: k8sdemo-aks

      - name: Deploy with Helm
        run: |
          helm upgrade --install k8s-demo ./helm \
            --namespace k8s-demo --create-namespace \
            --set image.tag=${{ github.sha }}
