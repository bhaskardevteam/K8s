trigger:
  branches:
    include: [main]

variables:
  acrName: 'myacr'
  imageName: 'k8s-demo-app'
  imageTag: '$(Build.BuildId)'
  k8sNamespace: 'k8s-demo'

stages:
  - stage: Build
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build and push image to ACR'
            inputs:
              containerRegistry: 'acr-service-connection'
              repository: '$(imageName)'
              command: 'buildAndPush'
              Dockerfile: 'docker/Dockerfile'
              buildContext: '.'
              tags: |
                $(imageTag)
                latest

  - stage: DeployStaging
    dependsOn: Build
    jobs:
      - deployment: DeployToStaging
        environment: 'staging'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmDeploy@0
                  displayName: 'Helm upgrade (staging)'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: 'aks-staging-connection'
                    namespace: '$(k8sNamespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: 'helm'
                    releaseName: 'k8s-demo'
                    overrideValues: 'image.tag=$(imageTag)'

  # Manual approval gate configured on the 'production' environment in Azure DevOps
  - stage: DeployProduction
    dependsOn: DeployStaging
    jobs:
      - deployment: DeployToProduction
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmDeploy@0
                  displayName: 'Helm upgrade (production)'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: 'aks-prod-connection'
                    namespace: '$(k8sNamespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: 'helm'
                    releaseName: 'k8s-demo'
                    overrideValues: 'image.tag=$(imageTag)'
