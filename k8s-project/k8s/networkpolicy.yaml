apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-demo-app-netpol
  namespace: k8s-demo
spec:
  podSelector:
    matchLabels:
      app: k8s-demo-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
